name: Update IT4IT Atlas

# Every night (04:00 Amsterdam winter time, 05:00 summer time): re-check the oldest entries of the
# IT4IT Atlas and look for missing products with Claude and web search (scripts/maintain-atlas.mjs), then commit
# atlas/tools.json and the daily report (atlas/activity.json) to main, which publishes them. The Worker e-mails the
# report at 07:30 Amsterdam time (worker/atlas-subscribers.js); GitHub may start a scheduled run late, hence the margin.
# Needs the repository secret ANTHROPIC_API_KEY.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      check:
        description: 'Number of tools to re-check'
        default: '40'
      new_subs:
        description: 'Number of subcategories to search for missing products'
        default: '3'

permissions:
  contents: write

concurrency:
  group: atlas-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Re-check and extend the Atlas
        run: node scripts/maintain-atlas.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ATLAS_CHECK: ${{ inputs.check || '40' }}
          ATLAS_NEW_SUBS: ${{ inputs.new_subs || '3' }}
      - name: Check that the site still builds
        run: node scripts/build-atlas.mjs
      - name: Commit the update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Tools removed on the site while this ran (the bin on a card) stay removed; on a clash with such a
          # change the version of this run wins, which already contains it.
          git add atlas/tools.json atlas/activity.json atlas/maintenance.json
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Daily update of the IT4IT Atlas"
          for i in 1 2 3; do
            git fetch origin main
            git show origin/main:atlas/tools.json > "$RUNNER_TEMP/main-tools.json"
            node scripts/atlas-keep-removed.mjs "$RUNNER_TEMP/main-tools.json" && git commit -q --amend --no-edit -a
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true; sleep 5
          done
          exit 1
