name: Update IT4IT Atlas

# Every night: re-check the oldest entries of the
# IT4IT Atlas and look for missing products with Claude and web search (scripts/maintain-atlas.mjs), then commit
# atlas/tools.json and the daily report (atlas/activity.json) to main, which publishes them. The Worker e-mails the
# report at 07:30 Amsterdam time (worker/atlas-subscribers.js). GitHub starts scheduled runs late or skips them now and
# then, so there are several slots (03:17 to 06:17 UTC); a slot does nothing once today's update is done.
# Needs the repository secret ANTHROPIC_API_KEY.
on:
  schedule:
    - cron: '17 3 * * *'
    - cron: '17 4 * * *'
    - cron: '17 5 * * *'
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      check:
        description: 'Number of tools to re-check'
        default: '40'
      new_subs:
        description: 'Number of subcategories to search for missing products'
        default: '3'

permissions:
  contents: write

concurrency:
  group: atlas-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Already done today?
        id: today
        if: github.event_name == 'schedule'
        run: |
          # Read main as it is now: this run may have waited behind an earlier slot that just finished.
          git fetch -q --depth 1 origin main
          if git show origin/main:atlas/activity.json | node -e "process.exit(JSON.parse(require('fs').readFileSync(0, 'utf8'))[0]?.date === new Date().toISOString().slice(0, 10) ? 0 : 1)"; then
            echo "Today's update is already done."; echo "done=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.today.outputs.done != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.today.outputs.done != 'true'
      - name: Re-check and extend the Atlas
        if: steps.today.outputs.done != 'true'
        run: node scripts/maintain-atlas.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ATLAS_CHECK: ${{ inputs.check || '40' }}
          ATLAS_NEW_SUBS: ${{ inputs.new_subs || '3' }}
      - name: Check that the site still builds
        if: steps.today.outputs.done != 'true'
        run: node scripts/build-atlas.mjs
      - name: Commit the update
        if: steps.today.outputs.done != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Tools removed on the site while this ran (the bin on a card) stay removed; on a clash with such a
          # change the version of this run wins, which already contains it.
          git add atlas/tools.json atlas/activity.json atlas/maintenance.json
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Daily update of the IT4IT Atlas"
          for i in 1 2 3; do
            git fetch origin main
            git show origin/main:atlas/tools.json > "$RUNNER_TEMP/main-tools.json"
            node scripts/atlas-keep-removed.mjs "$RUNNER_TEMP/main-tools.json" && git commit -q --amend --no-edit -a
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true; sleep 5
          done
          exit 1
