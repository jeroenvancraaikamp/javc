name: Translate

# After every change to articles, pages or the homepage text on main, translate what is new or
# changed into the other language (scripts/translate.mjs) and commit the translations.
# Needs the repository secret ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions).
on:
  push:
    branches: [main]
    paths:
      - 'src/content/articles/**'
      - 'src/content/pages/**'
      - 'src/content/translations/**'
      - 'src/data/home.json'
      - 'src/data/home.nl.json'
      - 'src/data/home.zh.json'
      - 'scripts/translate.mjs'
  workflow_dispatch:

permissions:
  contents: write

# One run at a time; a newer change waits and then picks up everything that is still to do.
concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Translate new and changed content
        run: node scripts/translate.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit translations
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/translations src/data/home.nl.json src/data/home.zh.json
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Update translations"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
