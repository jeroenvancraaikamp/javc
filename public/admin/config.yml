# Sveltia CMS settings: https://sveltiacms.app/
backend:
  name: github
  repo: jeroenvancraaikamp/javc
  branch: main
  commit_messages:
    create: 'Create {{collection}}: {{slug}}'
    update: 'Update {{collection}}: {{slug}}'
    delete: 'Delete {{collection}}: {{slug}}'
    uploadMedia: 'Upload image: {{path}}'
    deleteMedia: 'Delete image: {{path}}'

site_url: https://javc.nl
display_url: https://javc.nl

# The whole public folder is the media library, so both the imported WordPress images
# (/wp-content/uploads/...) and new uploads (/images/uploads/...) show up as thumbnails.
media_folder: /public
public_folder: /

collections:
  - name: home
    label: Homepage
    files:
      - name: home
        label: Homepage
        file: src/data/home.json
        format: json
        preview_path: '/'
        fields:
          - { name: title, label: Title (large heading), widget: string }
          - { name: subtitle, label: Subtitle, widget: string }
          - { name: text, label: Text over the video, widget: text }
          - { name: intro, label: Line below the video, widget: string, hint: 'Make a link like this: [text](/address/)' }
          - name: blocks
            label: Blocks
            widget: list
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Text, widget: text }
              - { name: button, label: Button text, widget: string }
              - { name: link, label: Button link, widget: string, hint: 'For example /skills/' }

  - name: home_nl
    label: Homepage (Nederlands)
    files:
      - name: home_nl
        label: Homepage (Nederlands)
        file: src/data/home.nl.json
        format: json
        preview_path: '/nl/'
        fields:
          - { name: title, label: Title (large heading), widget: string }
          - { name: subtitle, label: Subtitle, widget: string }
          - { name: text, label: Text over the video, widget: text }
          - { name: intro, label: Line below the video, widget: string }
          - name: blocks
            label: Blocks
            widget: list
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Text, widget: text }
              - { name: button, label: Button text, widget: string }
              - { name: link, label: Button link, widget: string }
          - { name: locked, label: Keep my edits, widget: boolean, default: false, required: false, hint: 'Translated automatically from the English homepage. Tick this after correcting it yourself, so a change to the English text does not overwrite your version.' }
          - { name: source, label: Source, widget: hidden, required: false }

  - name: home_zh
    label: Homepage (中文)
    files:
      - name: home_zh
        label: Homepage (中文)
        file: src/data/home.cn.json
        format: json
        preview_path: '/cn/'
        fields:
          - { name: title, label: Title (large heading), widget: string }
          - { name: subtitle, label: Subtitle, widget: string }
          - { name: text, label: Text over the video, widget: text }
          - { name: intro, label: Line below the video, widget: string }
          - name: blocks
            label: Blocks
            widget: list
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Text, widget: text }
              - { name: button, label: Button text, widget: string }
              - { name: link, label: Button link, widget: string }
          - { name: locked, label: Keep my edits, widget: boolean, default: false, required: false, hint: 'Translated automatically from the English homepage. Tick this after correcting it yourself, so a change to the English text does not overwrite your version.' }
          - { name: source, label: Source, widget: hidden, required: false }

  - name: articles
    label: Articles
    label_singular: Article
    folder: src/content/articles
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    preview_path: '/{{slug}}/'
    # List view: what each line shows (the CMS has no separate columns), sorting and filters.
    summary: "{{draft | ternary('DRAFT · ', '')}}{{title}}  ·  {{date | date('D MMM YYYY')}}  ·  {{categories}}  ·  updated {{commit_date | date('D MMM YYYY')}}"
    sortable_fields: [date, title, commit_date]
    view_filters:
      - { label: Drafts, field: draft, pattern: true }
      - { label: Popular, field: popular, pattern: true }
    view_groups:
      - label: Year
        field: date
        pattern: '\d{4}'
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, time_format: false, date_format: 'YYYY-MM-DD', format: 'YYYY-MM-DD' }
      - name: categories
        label: Categories
        widget: relation
        collection: categories
        file: categories
        search_fields: ['categories.*.name']
        value_field: 'categories.*.name'
        display_fields: ['categories.*.name']
        multiple: true
        default: [Uncategorized]
        hint: 'Manage the list under Categories in the menu on the left.'
      - { name: excerpt, label: Excerpt, widget: text, hint: 'Short text shown in the article lists.' }
      - { name: image, label: Featured image, widget: image, required: false }
      - { name: readingTime, label: Reading time (minutes), widget: number, value_type: int, required: false }
      - { name: popular, label: Show under Popular, widget: boolean, default: false, required: false }
      - { name: draft, label: Draft (do not publish), widget: boolean, default: false, required: false }
      - { name: lang, label: Language, widget: select, options: [{ label: English, value: en }, { label: Nederlands, value: nl }], default: en, required: false, hint: 'The language you write this in. The other languages are translated automatically (see Translations).' }
      - { name: linkedin, label: LinkedIn post, widget: string, required: false, hint: 'Optional: paste the link to your LinkedIn post about this article. A "Discuss this article on LinkedIn" button then appears next to the comments.' }
      - { name: body, label: Text, widget: markdown, modes: [rich_text, raw] }

  - name: categories
    label: Categories
    files:
      - name: categories
        label: Categories
        file: src/data/categories.json
        format: json
        fields:
          - name: categories
            label: Categories
            label_singular: Category
            widget: list
            hint: 'The categories you can choose for an article, in the order shown on the site (drag to reorder). Renaming or deleting one here does not change articles that already use it.'
            fields:
              - { name: name, label: Name, widget: string }

  - name: pages
    label: Pages
    label_singular: Page
    folder: src/content/pages
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    preview_path: '/{{slug}}/'
    summary: "{{title}}  ·  menu: {{menu | default('(not in menu)')}}  ·  updated {{commit_date | date('D MMM YYYY')}}"
    sortable_fields: [title, order, commit_date]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: menu, label: Menu name, widget: string, required: false, hint: 'Leave empty if the page should not be in the menu.' }
      - { name: order, label: Menu order, widget: number, value_type: int, default: 99, required: false }
      - { name: wide, label: Full width, widget: boolean, default: false, required: false }
      - { name: layout, label: Layout, widget: select, options: [{ label: Standard, value: default }, { label: 'Two columns (each ## heading is a block)', value: columns }], default: default, required: false }
      - { name: banner, label: Banner at the top, widget: image, required: false }
      - { name: lang, label: Language, widget: select, options: [{ label: English, value: en }, { label: Nederlands, value: nl }], default: en, required: false, hint: 'The language you write this in. The other languages are translated automatically (see Translations).' }
      - { name: legal, label: Legal text, widget: boolean, default: false, required: false, hint: 'The translation then says that the original text prevails.' }
      - { name: body, label: Text, widget: markdown, modes: [rich_text, raw] }

  # Automatic translations (scripts/translate.mjs, GitHub Action "Translate"). File name: <slug>.<lang>.md.
  - name: translations_articles
    label: Translations of articles
    label_singular: Translation
    folder: src/content/translations/articles
    extension: md
    format: frontmatter
    create: false
    delete: false
    identifier_field: title
    summary: "{{locked | ternary('KEPT · ', '')}}{{title}}  ·  {{slug}}"
    sortable_fields: [title, commit_date]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: excerpt, label: Excerpt, widget: text, required: false }
      - { name: menu, label: Menu name, widget: string, required: false }
      - { name: locked, label: Keep my edits, widget: boolean, default: false, required: false, hint: 'Tick this after correcting the translation yourself: changes to the original are then no longer translated over it.' }
      - { name: source, label: Source, widget: hidden, required: false }
      - { name: body, label: Text, widget: markdown, modes: [rich_text, raw] }

  - name: translations_pages
    label: Translations of pages
    label_singular: Translation
    folder: src/content/translations/pages
    extension: md
    format: frontmatter
    create: false
    delete: false
    identifier_field: title
    summary: "{{locked | ternary('KEPT · ', '')}}{{title}}  ·  {{slug}}"
    sortable_fields: [title, commit_date]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: excerpt, label: Excerpt, widget: text, required: false }
      - { name: menu, label: Menu name, widget: string, required: false }
      - { name: locked, label: Keep my edits, widget: boolean, default: false, required: false, hint: 'Tick this after correcting the translation yourself: changes to the original are then no longer translated over it.' }
      - { name: source, label: Source, widget: hidden, required: false }
      - { name: body, label: Text, widget: markdown, modes: [rich_text, raw] }
