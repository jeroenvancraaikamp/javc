<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>CMS – JAVC</title>
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms@0.231.0/dist/sveltia-cms.js"></script>
    <script>
      // Hide Sveltia's "now available on mobile" promotion bar.
      new MutationObserver(() => {
        // Only the bar itself: its message element, then the bar around it (never a larger container).
        for (const msg of document.querySelectorAll('div.message')) {
          const bar = msg.parentElement;
          if (bar && bar.style.display !== 'none' && msg.textContent.includes('available on mobile')) bar.style.display = 'none';
        }
      }).observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
